name: Release hygiene

on:
  push:
    branches: [main, public]
  pull_request:
    branches: [main, public]

permissions:
  contents: read

jobs:
  go-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Match the gateway build toolchain pinned in Dockerfile.
          go-version: '1.27.2'
      - name: Vet
        run: go vet ./...
      - name: Install pinned analysis tools
        run: sh scripts/install-analysis-tools.sh "$(go env GOPATH)/bin"
      - name: Staticcheck correctness checks
        run: staticcheck -checks='SA*' ./...
      - name: Race detection
        env:
          CGO_ENABLED: '1'
        run: go test -race ./... -count=1 -timeout=15m
      - name: Reachable Go vulnerabilities
        run: govulncheck ./...

  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sh scripts/verify-public-tree.sh
      - run: go build ./cmd/...
      - run: go test ./cmd/... ./internal/... ./tests/tools
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build:static
